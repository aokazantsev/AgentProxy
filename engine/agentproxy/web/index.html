<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AgentProxy</title>
<style>
:root { --bg: #ffffff; --fg: #1d1d1f; --muted: #6e6e73; --line: #e5e5ea; --row: #f5f5f7; --ok: #1a7f37; --bad: #c62828; --accent: #0a66c2; }
@media (prefers-color-scheme: dark) { :root { --bg: #161618; --fg: #f2f2f2; --muted: #9a9aa0; --line: #2c2c30; --row: #202024; --ok: #4cc26d; --bad: #ff6b6b; --accent: #5aa9ff; } }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 13px/1.45 "Segoe UI", system-ui, sans-serif; }
header { display: flex; gap: 18px; align-items: baseline; padding: 14px 20px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
header h1 { font-size: 15px; margin: 0; font-weight: 600; }
.stat { color: var(--muted); }
.stat b { color: var(--fg); font-weight: 600; }
.dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; background: var(--muted); }
.dot.on { background: var(--ok); } .dot.off { background: var(--bad); }
main { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); height: calc(100vh - 50px); }
@media (max-width: 900px) { main { grid-template-columns: 1fr; height: auto; } }
#list { overflow: auto; border-right: 1px solid var(--line); }
table { width: 100%; border-collapse: collapse; }
th, td { text-align: left; padding: 5px 10px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 0; }
th { position: sticky; top: var(--tools-height, 41px); background: var(--bg); color: var(--muted); font-weight: 500; border-bottom: 1px solid var(--line); }
tbody tr { cursor: pointer; } tbody tr:hover, tbody tr.sel { background: var(--row); }
.s2 { color: var(--ok); } .s4, .s5, .err { color: var(--bad); }
#detail { overflow: auto; padding: 14px 20px; }
#detail h2 { font-size: 13px; margin: 18px 0 6px; color: var(--muted); font-weight: 500; text-transform: uppercase; letter-spacing: .04em; }
pre { margin: 0; white-space: pre-wrap; word-break: break-all; font: 12px/1.45 Consolas, monospace; background: var(--row); padding: 8px 10px; border-radius: 6px; }
.empty { color: var(--muted); padding: 20px; }
#tools { display: flex; gap: 14px; align-items: center; padding: 8px 10px; border-bottom: 1px solid var(--line); flex-wrap: wrap; position: sticky; top: 0; background: var(--bg); z-index: 2; }
#tools label { color: var(--muted); display: flex; gap: 6px; align-items: center; }
#tools select { font: inherit; color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 4px; padding: 2px 4px; }
th.sortable { cursor: pointer; user-select: none; }
th.sortable:hover { color: var(--fg); }
tr.child td:first-child { padding-left: 22px; }
tr.group td { font-weight: 500; }
.caret { display: inline-block; width: 14px; color: var(--muted); }
.count { color: var(--accent); margin-right: 4px; }
tr.node td { max-width: none; font-weight: 500; }
#menu { position: fixed; z-index: 10; max-width: calc(100vw - 8px); background: var(--bg); border: 1px solid var(--line); border-radius: 6px; box-shadow: 0 4px 16px rgba(0, 0, 0, .25); padding: 4px 0; }
#menu div { padding: 5px 14px; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#menu div:hover { background: var(--row); }
</style>
</head>
<body>
<header>
  <h1>AgentProxy</h1>
  <span class="stat"><span id="dot" class="dot"></span><span id="state">…</span></span>
  <span class="stat">прокси <b id="proxy">—</b></span>
  <span class="stat">запросов <b id="count">—</b></span>
  <span class="stat">правил подмены <b id="rules">—</b></span>
  <span class="stat">версия <b id="version">—</b></span>
</header>
<main>
  <section id="list">
    <div id="tools">
      <label>метод <select id="fMethod"><option value="">все</option></select></label>
      <label>код <select id="fCode">
        <option value="">все</option><option value="1">1xx</option><option value="2">2xx</option><option value="3">3xx</option><option value="4">4xx</option><option value="5">5xx</option><option value="err">ошибка</option>
      </select></label>
      <label>вид <select id="fMode">
        <option value="list">список</option><option value="group">группы одинаковых</option><option value="tree">дерево</option>
      </select></label>
      <label title="Закрепить хост — правая кнопка мыши по хосту"><input type="checkbox" id="fPinned"> только закреплённые</label>
    </div>
    <table>
      <colgroup><col style="width:56px"><col style="width:72px"><col style="width:52px"><col style="width:26%"><col><col style="width:76px"><col style="width:64px"><col style="width:64px"></colgroup>
      <thead><tr id="heads"></tr></thead>
      <tbody id="rows"></tbody>
    </table>
    <div id="none" class="empty" hidden>Запросов пока нет. Направь трафик устройства на прокси — инструкция в скилле agentproxy.</div>
    <div id="nomatch" class="empty" hidden>Под фильтры ничего не попало.</div>
  </section>
  <section id="detail"><div class="empty">Выбери запрос слева.</div></section>
</main>
<div id="menu" hidden></div>
<script>
"use strict";
let selected = null;
let stream = null;
const EVENT_LINES = 5000;
const text = (value) => value === null || value === undefined ? "" : String(value);
function cell(row, value, cls) { const td = row.insertCell(); td.textContent = text(value); td.title = text(value); if (cls) td.className = cls; }
async function getJson(url) { const response = await fetch(url, { cache: "no-store" }); if (!response.ok) throw new Error(response.status); return response.json(); }
async function refreshStatus() {
  try {
    const status = await getJson("/api/status");
    document.getElementById("dot").className = "dot " + (status.proxy.running ? "on" : "off");
    document.getElementById("state").textContent = status.proxy.running ? "работает" : "прокси не слушает порт";
    document.getElementById("proxy").textContent = status.proxy.host + ":" + status.proxy.port;
    document.getElementById("count").textContent = status.flows;
    document.getElementById("rules").textContent = status.rules ? status.rules.active + (status.rules.problem ? " ⚠" : "") : "—";
    document.getElementById("rules").title = status.rules && status.rules.problem ? status.rules.problem : "";
    document.getElementById("version").textContent = status.version;
  } catch (error) {
    document.getElementById("dot").className = "dot off";
    document.getElementById("state").textContent = "движок не отвечает";
  }
}
const COLUMNS = [["seq", "#"], ["method", "метод"], ["code", "код"], ["host", "хост"], ["path", "путь"], ["duration_ms", "мс"], ["event_count", "соб."], ["rules", "правила"]];
const view = { method: "", code: "", pinnedOnly: false, sortKey: "seq", sortDir: -1 };
const MODES = ["list", "group", "tree"];
const expanded = new Set();
const treeOpen = new Set();
let lastFlows = [];
try { Object.assign(view, JSON.parse(localStorage.getItem("agentproxy.view") || "{}")); } catch (error) {}
if (MODES.indexOf(view.mode) < 0) view.mode = view.group === true ? "group" : "list";
delete view.group;
let pinnedHosts = [];
let pinsChanged = 0;
const PIN = "📌 ";
function isPinned(host) { return pinnedHosts.indexOf(host) >= 0; }
async function togglePin(host, pin) {
  try {
    const response = await fetch("/api/monitor/pins", { method: "POST", cache: "no-store", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ host: host, pinned: pin }) });
    const data = await response.json();
    if (!response.ok) throw new Error(data.error || response.status);
    pinnedHosts = data.pinned_hosts;
    pinsChanged += 1;
  } catch (error) {
    window.alert("Не удалось сохранить закрепление: " + error.message);
    return;
  }
  render();
}
function hideMenu() { document.getElementById("menu").hidden = true; }
function showMenu(event, host) {
  event.preventDefault();
  const menu = document.getElementById("menu");
  menu.textContent = "";
  const item = document.createElement("div");
  item.textContent = (isPinned(host) ? "Открепить " : "Закрепить ") + host;
  item.title = item.textContent;
  const pin = !isPinned(host);
  item.onclick = () => { hideMenu(); togglePin(host, pin); };
  menu.appendChild(item);
  menu.hidden = false;
  menu.style.left = Math.max(0, Math.min(event.clientX, window.innerWidth - menu.offsetWidth - 4)) + "px";
  menu.style.top = Math.max(0, Math.min(event.clientY, window.innerHeight - menu.offsetHeight - 4)) + "px";
}
function kindLabel(flow) {
  if (!flow.kind) return flow.method;
  return (flow.kind === "sse" ? "SSE" : "WS") + (flow.open ? " ●" : "");
}
function saveView() { try { localStorage.setItem("agentproxy.view", JSON.stringify(view)); } catch (error) {} }
function codeClass(flow) { return flow.error ? "err" : String(flow.status || "").charAt(0); }
function sortValue(flow, key) {
  if (key === "code") return flow.error ? 1000 : flow.status;
  if (key === "rules") return ruleIds(flow.rules);
  return flow[key];
}
function compareFlows(a, b) {
  const x = sortValue(a, view.sortKey), y = sortValue(b, view.sortKey);
  const missingX = x === null || x === undefined || x === "", missingY = y === null || y === undefined || y === "";
  if (missingX !== missingY) return missingX ? 1 : -1;
  if (missingX) return 0;
  const result = typeof x === "number" && typeof y === "number" ? x - y : String(x).localeCompare(String(y), "ru", { numeric: true });
  return result * view.sortDir;
}
function groupKey(flow) { return flow.method + " " + flow.host + ":" + flow.port + flow.path.split("?")[0]; }
function treeRoot(flow) {
  const scheme = flow.scheme || (flow.port === 80 ? "http" : "https");
  const standard = flow.port === (scheme === "http" ? 80 : 443);
  return scheme + "://" + flow.host + (standard ? "" : ":" + flow.port);
}
function buildTree(flows) {
  const root = { key: "", children: new Map(), flows: [] };
  for (const flow of flows) {
    let node = root;
    const parts = [treeRoot(flow)].concat(flow.path.split("?")[0].split("/").filter((part) => part));
    for (const part of parts) {
      if (!node.children.has(part)) node.children.set(part, { key: node.key + "\n" + part, name: part, host: flow.host, children: new Map(), flows: [], count: 0, selected: false });
      node = node.children.get(part);
      node.count += 1;
      if (flow.id === selected) node.selected = true;
    }
    node.flows.push(flow);
  }
  return root;
}
function renderTree(body, node, depth) {
  const pinRank = (child) => depth === 0 && isPinned(child.host) ? 0 : 1;
  const byName = (a, b) => a.localeCompare(b, "ru", { numeric: true });
  const children = Array.from(node.children.values()).sort((a, b) => pinRank(a) - pinRank(b) || (depth === 0 ? byName(a.host, b.host) : 0) || byName(a.name, b.name));
  for (const child of children) {
    const open = treeOpen.has(child.key);
    const row = body.insertRow();
    row.className = "node" + (!open && child.selected ? " sel" : "");
    const td = row.insertCell();
    td.colSpan = COLUMNS.length;
    td.style.paddingLeft = 10 + depth * 16 + "px";
    td.title = child.name;
    const caret = document.createElement("span");
    caret.className = "caret"; caret.textContent = open ? "▾" : "▸";
    const count = document.createElement("span");
    count.className = "count"; count.textContent = " ×" + child.count;
    td.appendChild(caret); td.appendChild(document.createTextNode((pinRank(child) ? "" : PIN) + child.name)); td.appendChild(count);
    if (depth === 0) td.oncontextmenu = (event) => showMenu(event, child.host);
    row.onclick = () => { if (open) treeOpen.delete(child.key); else treeOpen.add(child.key); render(); };
    if (open) renderTree(body, child, depth + 1);
  }
  for (const flow of node.flows.slice().sort(compareFlows)) addRow(body, flow, "child");
}
function buildHeads() {
  const heads = document.getElementById("heads");
  heads.textContent = "";
  for (const [key, title] of COLUMNS) {
    const th = document.createElement("th");
    th.className = "sortable";
    th.textContent = title + (view.sortKey === key ? (view.sortDir > 0 ? " ▲" : " ▼") : "");
    th.onclick = () => {
      if (view.sortKey === key) view.sortDir = -view.sortDir; else { view.sortKey = key; view.sortDir = key === "seq" ? -1 : 1; }
      saveView(); buildHeads(); render();
    };
    heads.appendChild(th);
  }
}
function fillMethods() {
  const select = document.getElementById("fMethod");
  const methods = Array.from(new Set(lastFlows.map((flow) => flow.method))).sort();
  if (view.method && methods.indexOf(view.method) < 0) methods.push(view.method);
  const wanted = [""].concat(methods).join("|");
  if (select.dataset.options !== wanted) {
    select.dataset.options = wanted;
    select.textContent = "";
    for (const method of [""].concat(methods)) {
      const option = document.createElement("option");
      option.value = method; option.textContent = method || "все";
      select.appendChild(option);
    }
  }
  select.value = view.method;
}
function addRow(body, flow, cls, group) {
  const row = body.insertRow();
  row.className = ((cls || "") + (flow.id === selected ? " sel" : "")).trim();
  cell(row, flow.seq);
  cell(row, kindLabel(flow));
  cell(row, flow.error && !(flow.kind && flow.status) ? "ошибка" : flow.status, flow.error ? "err" : "s" + codeClass(flow));
  if (flow.error) row.cells[2].title = flow.error;
  cell(row, (isPinned(flow.host) ? PIN : "") + flow.host);
  row.cells[3].oncontextmenu = (event) => showMenu(event, flow.host);
  cell(row, flow.path);
  cell(row, flow.open ? "открыт" : flow.duration_ms);
  cell(row, flow.event_count);
  cell(row, ruleIds(flow.rules));
  if (group) {
    const first = row.cells[0];
    first.textContent = "";
    const caret = document.createElement("span");
    caret.className = "caret"; caret.textContent = expanded.has(group.key) ? "▾" : "▸";
    first.appendChild(caret);
    first.appendChild(document.createTextNode(text(flow.seq)));
    const count = document.createElement("span");
    count.className = "count"; count.textContent = "×" + group.items.length + " ";
    row.cells[4].insertBefore(count, row.cells[4].firstChild);
    row.className = "group" + (!expanded.has(group.key) && group.items.some((item) => item.id === selected) ? " sel" : "");
    row.onclick = () => { if (expanded.has(group.key)) expanded.delete(group.key); else expanded.add(group.key); render(); };
  } else {
    row.onclick = () => showFlow(flow.id);
  }
}
function fitHeads() { document.documentElement.style.setProperty("--tools-height", document.getElementById("tools").offsetHeight + "px"); }
function render() {
  fillMethods();
  const flows = lastFlows.filter((flow) => (!view.method || flow.method === view.method) && (!view.code || codeClass(flow) === view.code) && (!view.pinnedOnly || isPinned(flow.host)));
  const body = document.getElementById("rows");
  body.textContent = "";
  if (view.mode === "tree") {
    renderTree(body, buildTree(flows), 0);
  } else if (view.mode === "group") {
    const groups = new Map();
    for (const flow of flows) {
      const key = groupKey(flow);
      if (!groups.has(key)) groups.set(key, { key: key, items: [] });
      groups.get(key).items.push(flow);
    }
    const entries = Array.from(groups.values());
    for (const entry of entries) { entry.items.sort(compareFlows); entry.head = entry.items[0]; }
    entries.sort((a, b) => compareFlows(a.head, b.head));
    for (const entry of entries) {
      if (entry.items.length === 1) { addRow(body, entry.head); continue; }
      addRow(body, entry.head, "group", entry);
      if (expanded.has(entry.key)) for (const flow of entry.items) addRow(body, flow, "child");
    }
  } else {
    for (const flow of flows.slice().sort(compareFlows)) addRow(body, flow);
  }
  document.getElementById("none").hidden = lastFlows.length > 0;
  document.getElementById("nomatch").hidden = lastFlows.length === 0 || flows.length > 0;
  fitHeads();
}
async function refreshFlows() {
  let data;
  try { data = await getJson("/api/flows?limit=300"); } catch (error) { return; }
  lastFlows = data.flows;
  const changes = pinsChanged;
  try { const pins = await getJson("/api/monitor/pins"); if (changes === pinsChanged) pinnedHosts = pins.pinned_hosts; } catch (error) {}
  render();
}
function initTools() {
  const method = document.getElementById("fMethod"), code = document.getElementById("fCode"), mode = document.getElementById("fMode"), pinned = document.getElementById("fPinned");
  code.value = view.code; mode.value = view.mode; pinned.checked = !!view.pinnedOnly;
  method.onchange = () => { view.method = method.value; saveView(); render(); };
  code.onchange = () => { view.code = code.value; saveView(); render(); };
  mode.onchange = () => { view.mode = mode.value; expanded.clear(); treeOpen.clear(); saveView(); render(); };
  pinned.onchange = () => { view.pinnedOnly = pinned.checked; saveView(); render(); };
  document.addEventListener("click", hideMenu);
  document.addEventListener("keydown", (event) => { if (event.key === "Escape") hideMenu(); });
  window.addEventListener("scroll", hideMenu, true);
  window.addEventListener("blur", hideMenu);
  window.addEventListener("resize", fitHeads);
}
function ruleIds(rules) { return (rules || []).map((rule) => rule.id).join(" "); }
function rulesText(rules) {
  return (rules || []).map((rule) => rule.id + " " + rule.action + (rule.name ? " — " + rule.name : "") +
    (rule.error ? ", ошибка: " + rule.error : "") + (rule.skipped ? ", " + rule.skipped : "") +
    (rule.replaced !== undefined ? ", замен: " + rule.replaced : "") +
    (rule.limited ? ", скорость ограничена: " + (rule.limited === "request" ? "запрос" : "соединение целиком") : "") +
    (rule.not_found ? ", не найдено: " + rule.not_found.join(" | ") : "")).join("\n");
}
function headersText(headers) { return (headers || []).map((pair) => pair[0] + ": " + pair[1]).join("\n"); }
function section(parent, title, content) {
  const heading = document.createElement("h2"); heading.textContent = title; parent.appendChild(heading);
  const block = document.createElement("pre"); block.textContent = content || "—"; parent.appendChild(block);
}
function bodyText(body) {
  if (!body || !body.size) return "";
  const note = body.truncated ? "\n\n… обрезано, полный размер " + body.size + " байт" : "";
  return (body.encoding === "base64" ? "[base64] " : "") + body.content + note;
}
async function showFlow(id) {
  selected = id;
  let flow;
  try { flow = await getJson("/api/flows/" + encodeURIComponent(id)); } catch (error) { return; }
  const detail = document.getElementById("detail");
  detail.textContent = "";
  section(detail, "Запрос", flow.method + " " + flow.url);
  if (flow.rules && flow.rules.length) section(detail, "Правила подмены", rulesText(flow.rules));
  section(detail, "Ответ", flow.error ? "Ошибка: " + flow.error : text(flow.status) + " " + text(flow.reason) + (flow.duration_ms !== null ? ", " + flow.duration_ms + " мс" : ""));
  section(detail, "Заголовки запроса", headersText(flow.request_headers));
  section(detail, "Тело запроса", bodyText(flow.request_body));
  section(detail, "Заголовки ответа", headersText(flow.response_headers));
  if (flow.kind) {
    section(detail, "События", "");
    stream = { id: flow.id, last: 0, box: detail.lastChild, open: true, busy: false };
    stream.box.textContent = "";
    stream.box.style.maxHeight = "60vh";
    stream.box.style.overflow = "auto";
    pollEvents();
  } else {
    stream = null;
    section(detail, "Тело ответа", bodyText(flow.response_body));
  }
  refreshFlows();
}
function eventLine(event) {
  const head = "#" + event.n + " +" + (event.ms / 1000).toFixed(2) + "с " + (event.direction === "outgoing" ? "→" : "←") + " " + event.type +
    (event.name ? " " + event.name : "") + (event.id ? " id=" + event.id : "") + (event.note ? " (" + event.note + ")" : "");
  const data = event.data ? (event.encoding === "base64" ? "[base64] " : "") + event.data + (event.truncated ? " … обрезано, размер " + event.size : "") : "";
  return data ? head + "\n" + data : head;
}
async function pollEvents() {
  const current = stream;
  if (!current || current.busy || !current.open) return;
  current.busy = true;
  try {
    const answer = await getJson("/api/events?flow=" + encodeURIComponent(current.id) + "&since_n=" + current.last + "&limit=500&max_data_chars=4000");
    if (stream !== current) return;
    const box = current.box;
    const atEnd = box.scrollTop + box.clientHeight >= box.scrollHeight - 8;
    for (const event of answer.events) {
      const line = document.createElement("div");
      line.textContent = eventLine(event);
      line.style.whiteSpace = "pre-wrap";
      line.style.wordBreak = "break-all";
      line.style.marginBottom = "6px";
      line.style.color = event.direction === "outgoing" ? "var(--accent)" : "var(--fg)";
      box.appendChild(line);
      current.last = event.n;
    }
    while (box.childNodes.length > EVENT_LINES) box.removeChild(box.firstChild);
    if (!box.firstChild && !answer.flow.open) box.textContent = "Событий не было.";
    if (atEnd) box.scrollTop = box.scrollHeight;
    if (!answer.flow.open && answer.events.length < 500) current.open = false;
  } catch (error) {
    if (error.message === "404" && stream === current) { current.open = false; current.box.appendChild(document.createTextNode("Запись удалена из истории.")); }
  } finally {
    current.busy = false;
  }
}
initTools(); buildHeads(); refreshStatus(); refreshFlows();
setInterval(refreshStatus, 3000);
setInterval(refreshFlows, 2000);
setInterval(pollEvents, 1000);
</script>
</body>
</html>
