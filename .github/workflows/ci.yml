name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Runtime
        run: py tools\runtime.py fetch
      - name: Engine tests
        run: py tools\test.py
      - name: Build tray app
        shell: cmd
        run: build.cmd nostart
      - name: C# tests
        shell: cmd
        run: tests\csharp\run.cmd
      - name: Installer
        shell: cmd
        run: build-installer.cmd
